server:
  port: 8080

spring:
  application:
    name: shop
  profiles:
    active: local  # 기본 프로필
  jpa:
    properties:
      hibernate:
        #        show_sql: true
        format_sql: true
        default_batch_fetch_size: 100

logging:
  level:
    org.springframework: debug
    org.hibernate.SQL: debug        # SQL
    org.hibernate.orm.jdbc.bind: trace #

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 상품 이미지 업로드 경로
itemImgLocation: "/Users/kim/myroot/shop/item/"

# 리소스 URL 패턴 지정 경로, 프로젝트 외부에서 파일 찾는 경로
uploadPath: "file:////Users/kim/myroot/shop/"

jwt:
  secret: your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm
  access-token-validity: 900000    # 15분 (밀리초)
  refresh-token-validity: 1209600000 # 2주 (밀리초)
