spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  
  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com.shop: debug

# JWT 설정 (테스트용)
jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-test-12345
  access-token-validity: 900000
  refresh-token-validity: 1209600000
