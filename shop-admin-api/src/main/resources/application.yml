spring:
  application:
    name: shop-admin-api

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8081

# JWT 설정
jwt:
  secret: yourSecretKeyHereMinimum256BitsForHS256AlgorithmSecurityRequirement
  expiration: 3600000  # 1시간 (밀리초)

logging:
  level:
    com.shop: DEBUG
